spring.application.name=horizon-immo

spring.datasource.url=jdbc:sqlite:data/horizon-immo.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080

# Agent vocal x.ai : la cle vient de la variable d'environnement XAI_API_KEY
# (definie dans deploy/horizon-immo.env sur le serveur, jamais commitee).
xai.api-key=${XAI_API_KEY:}
xai.model=${XAI_MODEL:grok-voice-latest}
xai.voice=${XAI_VOICE:eve}

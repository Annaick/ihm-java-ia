spring.application.name=horizon-immo

spring.datasource.url=jdbc:sqlite:data/horizon-immo.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8080

# Agent vocal x.ai (Voice Agent Builder) : la cle et l'ID d'agent viennent
# des variables d'environnement XAI_API_KEY / XAI_AGENT_ID (definies dans
# deploy/horizon-immo.env sur le serveur, jamais commitees).
xai.api-key=${XAI_API_KEY:}
xai.agent-id=${XAI_AGENT_ID:}

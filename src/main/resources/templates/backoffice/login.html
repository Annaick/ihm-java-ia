<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pagehead('Connexion agent')}"></head>
<body>
<div class="login-shell">
    <div class="login-card">
        <h1>🏠 Horizon Backoffice</h1>
        <p class="subtitle">Connectez-vous pour retrouver vos rendez-vous qualifiés par l'IA.</p>

        <div class="login-error" th:if="${error}">Email ou mot de passe incorrect.</div>

        <form method="post" th:action="@{/backoffice/login}">
            <label for="username">Email</label>
            <input type="email" id="username" name="username" required autocomplete="username"/>

            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"/>

            <button class="btn" type="submit">Se connecter</button>
        </form>
    </div>
</div>
</body>
</html>

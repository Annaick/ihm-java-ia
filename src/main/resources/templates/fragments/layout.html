<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:fragment="pagehead(title)">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <title th:text="${title} + ' - Horizon Immo'">Horizon Immo</title>
        <link rel="preconnect" href="https://fonts.googleapis.com"/>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&display=swap"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
        <link rel="stylesheet" th:href="@{/css/style.css}"/>
    </th:block>
</head>
<body>
<header class="app-bar" th:fragment="appbar">
    <a class="logo" th:href="@{/}"><i class="bi bi-house-door-fill"></i> Horizon Immo</a>
    <nav>
        <a th:href="@{/}">Accueil</a>
        <a th:href="@{/annonces}">Annonces</a>
        <a href="#" class="btn" onclick="document.getElementById('voice-fab').click(); return false;">
            <i class="bi bi-headset"></i> Parler à un spécialiste
        </a>
    </nav>
</header>

<div th:fragment="voice-widget">
    <button id="voice-fab" class="voice-fab" type="button" title="Parler à notre conseiller">
        <i class="bi bi-headset"></i>
    </button>

    <div id="voice-panel" class="voice-panel call-panel">
        <button type="button" class="call-dismiss" id="voice-close" title="Réduire">
            <i class="bi bi-chevron-down"></i>
        </button>

        <div class="call-avatar-ring" id="voice-avatar-ring">
            <div class="call-avatar"><i class="bi bi-headset"></i></div>
        </div>

        <div class="call-name">Assistant Horizon Immo</div>
        <div class="call-status" id="voice-status-line">Appel...</div>
        <div class="call-timer" id="voice-timer">00:00</div>

        <button type="button" id="voice-mic" class="call-hangup" title="Raccrocher">
            <i class="bi bi-telephone-x-fill"></i>
        </button>
    </div>
</div>

<footer th:fragment="footer">
    <p>Horizon Immo — Agence immobilière · Ouverte du lundi au samedi, 9h-19h.<br/>
        Notre conseiller vocal, lui, répond 24h/24.</p>
</footer>
</body>
</html>
